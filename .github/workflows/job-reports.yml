# Tests the Routines tools on every PR that touches them, and puts the hosted site
# (tools/job-reports) live on every push to main, or by hand from the Actions tab.
#
# Hosting needs four repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN      a Cloudflare API token: the "Edit Cloudflare Workers" template,
#                             plus Account > D1 > Edit
#   CLOUDFLARE_ACCOUNT_ID     shown on the Cloudflare dashboard's Workers overview
#   JOB_REPORTS_ADMIN_TOKEN   any long random string: the site's sign-in password
#   JOB_REPORTS_REPORT_TOKEN  another one: what jobs send with their reports
# and, for alerts, optionally ALERT_SLACK_WEBHOOK and/or ALERT_NTFY_URL.
# scripts/setup.mjs does the rest: it creates the database the first time, migrates and deploys.
# Without CLOUDFLARE_API_TOKEN the deploy job is skipped, so forks and fresh clones stay green.
name: job-reports

on:
  pull_request:
    paths: ["tools/job-reports/**", "tools/pr-dashboard/**", ".github/workflows/job-reports.yml"]
  push:
    branches: [main]
    paths: ["tools/job-reports/**", "tools/pr-dashboard/**", ".github/workflows/job-reports.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Two deploys at once could both create the database; let one finish first.
concurrency:
  group: job-reports-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Worker tests
        working-directory: tools/job-reports
        run: node --test test/*.test.mjs
      - name: Dashboard tests
        working-directory: tools/pr-dashboard
        # test_launch.py drives Windows-only process flags and is run on Windows by hand.
        run: python -m unittest test_routines.py test_collect.py test_desktop.py test_endpoint.py test_server.py test_github.py test_screenery.py test_awake.py test_prune_screenery.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with: { node-version: 22 }
      - name: Create, migrate and deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: tools/job-reports
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JOB_REPORTS_ADMIN_TOKEN: ${{ secrets.JOB_REPORTS_ADMIN_TOKEN }}
          JOB_REPORTS_REPORT_TOKEN: ${{ secrets.JOB_REPORTS_REPORT_TOKEN }}
          ALERT_SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
          ALERT_NTFY_URL: ${{ secrets.ALERT_NTFY_URL }}
        run: node scripts/setup.mjs
